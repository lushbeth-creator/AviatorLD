<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrainingFlightDeck</title>
<style>
:root{--blue:#5D70AE;--green:#59A398;--light:#DAF3EF;--purple:#A6B3D5;--pale:#F3F6FF;--navy:#1B2F5B;--muted:#444}
*{box-sizing:border-box}html,body{background:transparent}
body{margin:0;padding:14px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy)}
.deck{max-width:100%;margin:0}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
.eyebrow{display:block;margin:0 0 8px;color:var(--green);font-size:16px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
h1{margin:0 0 8px;color:var(--navy);font-size:20px;line-height:1.25}
.subtitle{margin:0;color:#000;font-size:18px;line-height:1.55}
.nav-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:16px 0;border-top:1px solid rgba(93,112,174,.18);border-bottom:1px solid rgba(93,112,174,.18)}
.pill{display:inline-block;background:linear-gradient(to bottom,#ffffff 0%,var(--light) 100%);color:var(--navy);font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;border:1px solid var(--purple);text-decoration:none;white-space:nowrap;transition:.15s ease}
.pill:hover{border-color:var(--blue);background:linear-gradient(to bottom,#ffffff 0%,#E4E9F7 100%)}
.pill.pill-wings{background:linear-gradient(to bottom,#ffffff 0%,#e9ecef 100%);color:#8892a8;border-color:#c7ccd6}
.pill.pill-wings:hover{background:linear-gradient(to bottom,#ffffff 0%,#dde1e6 100%);border-color:#8892a8}
.soon-tag{margin-left:7px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
@media(max-width:700px){.hero-top{flex-direction:column}.nav-row{overflow-x:auto;flex-wrap:nowrap}}
</style>
</head>
<body>
<main class="deck">

<div class="hero-top">
  <div>
    <h1>Your training flight deck.</h1>
    <p class="subtitle">Build confidence in payments, solutions and field conversations. Start with onboarding, choose the learning you need and return whenever you want a refresher.</p>
  </div>
</div>

<nav class="nav-row" aria-label="Learning team home sections">
  <a class="pill" target="_top" href="https://propelrpay1.sharepoint.com/sites/AviatorLD/SitePages/LearningTeamHome.aspx#start-here-______________________________________________________________________________">Start Here</a>
  <a class="pill" target="_top" href="https://propelrpay1.sharepoint.com/sites/AviatorLD/SitePages/LearningTeamHome.aspx#aviator-academy-_______________________________________________________________________">Aviator Academy</a>
  <a class="pill" target="_top" href="https://propelrpay1.sharepoint.com/sites/AviatorLD/SitePages/LearningTeamHome.aspx#appointment-resources-________________________________________________________________">Appointment Resources</a>
  <a class="pill" target="_top" href="https://propelrpay1.sharepoint.com/sites/AviatorLD/SitePages/LearningTeamHome.aspx#resource-library-________________________________________________________________________">Resource Library</a>
  <a class="pill" target="_top" href="https://propelrpay1.sharepoint.com/sites/AviatorLD/SitePages/LearningTeamHome.aspx#find-the-right-support-_________________________________________________________________">Get Support</a>
  <a class="pill pill-wings" target="_top" href="https://propelrpay1.sharepoint.com/sites/AviatorLD/SitePages/LearningTeamHome.aspx#earning-your-wings-_____________________________________________________________________">Earning Your Wings<span class="soon-tag">Coming Soon</span></a>
</nav>

</main>
</body>
</html>
