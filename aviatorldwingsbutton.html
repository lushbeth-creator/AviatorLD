<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviators Page — Placeholder Buttons</title>
<style>
  :root {
    --blue: #5D70AE;
    --green: #59A398;
    --navy: #1B2F5B;
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
  }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 12px;
  }

  .actions {
    display: flex;
    gap: 14px;
  }

  .btn-primary {
    display: inline-block;
    background: var(--green);
    color: #ffffff;
    padding: 13px 24px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    cursor: default;
  }

  .btn-ghost {
    display: inline-block;
    padding: 13px 24px;
    border: 1px solid var(--blue);
    border-radius: 8px;
    text-decoration: none;
    color: var(--blue);
    font-size: 14px;
    font-weight: 600;
    background: #ffffff;
    cursor: default;
  }
</style>
</head>
<body>

  <div class="actions">
    <span class="btn-primary" role="presentation">Explore Earn Your Wings</span>
    <span class="btn-ghost" role="presentation">Open Flight Bag</span>
  </div>

</body>
</html>
