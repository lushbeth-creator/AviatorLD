<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who to Call Section</title>
<style>
  :root {
    --green: #59A398;
    --blue: #5D70AE;
    --navy: #1B2F5B;
    --border: #A6B3D5;
    --body: #444;
    --sep: #A6B3D5;
  }

  * { box-sizing: border-box; }

  html, body { background: transparent; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 12px;
  }

  .contact-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .contact-block { display: flex; flex-direction: column; }

  .contact-role {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--green);
    margin: 0 0 10px;
  }

  .contact-card {
    background: linear-gradient(to bottom, #ffffff 0%, #E8EDF8 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .contact-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    border: 2px solid #ffffff;
    box-shadow: 0 0 0 1px var(--border);
  }

  .contact-name {
    font-weight: 700;
    font-size: 16px;
    color: var(--navy);
    margin: 0 0 6px;
  }

  .contact-info {
    font-size: 13px;
    color: var(--body);
    line-height: 1.6;
  }

  .contact-info a {
    color: var(--green);
    font-weight: 600;
    text-decoration: none;
  }
  .contact-info a:hover { color: var(--blue); }
  .contact-info .sep { color: var(--sep); margin: 0 6px; }

  @media (max-width: 760px) {
    .contact-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
