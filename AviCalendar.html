<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propelr: Onboarding Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:'Inter',sans-serif;color:#1a1a2e;padding:0}

.cal-wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:640px){.cal-wrap{grid-template-columns:1fr}}

/* ===== Calendar ===== */
.cal-card{background:transparent;padding:0;display:flex;flex-direction:column}
.cal-nav{display:flex;align-items:center;justify-content:space-between;width:386px;max-width:100%;margin:0 auto 1rem}
.cal-month{font-family:'Inter',sans-serif;font-weight:700;font-size:19px;color:#1B2F5B}
.cal-arrow{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.cal-arrow:hover svg{stroke:#5D70AE}
.cal-arrow svg{width:18px;height:18px;stroke:#59A398;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.cal-arrow.disabled{cursor:default;pointer-events:none}
.cal-arrow.disabled svg{stroke:#d8dce8}

.cal-grid{display:grid;grid-template-columns:repeat(7,50px);gap:6px;justify-content:center}
.cal-dow{font-size:13px;font-weight:700;text-transform:uppercase;color:#888;text-align:center;padding:2px 0}
.cal-day{
  position:relative;width:50px;height:50px;display:flex;align-items:center;justify-content:center;
  font-size:18.5px;color:#444;border-radius:6px;border:1px solid transparent;background:none;
  font-family:'Inter',sans-serif;cursor:default;transition:background .15s,border-color .15s,color .15s;
}
.cal-day.blank{visibility:hidden}
.cal-day.has-event{cursor:pointer;color:#1B2F5B;font-weight:700}
.cal-day.has-event:hover{background:#DAF3EF;border-radius:50%}
.cal-day.selected{background:#59A398;color:#fff;border-radius:50%}
.cal-day .dot-row{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.cal-day .dot{width:8px;height:8px;border-radius:50%;box-sizing:border-box;display:block}
.cal-day.selected .dot{background:#fff !important;border-color:#fff !important}

.cal-hint{font-size:13.5px;color:#59A398;font-weight:600;line-height:1.5;margin-top:16px;text-align:center}

.cal-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:11px 16px;margin-top:18px;padding-top:14px;border-top:1px solid #d8dce8}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:#555}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-sizing:border-box}

/* ===== Detail panel ===== */
.detail-card{background:transparent;padding:0;display:flex;flex-direction:column}
.detail-empty{display:none}
.detail-title{font-family:'Inter',sans-serif;font-weight:700;font-size:19px;color:#1B2F5B;margin-bottom:9px;text-wrap:balance;flex-shrink:0}
.detail-meta{display:flex;align-items:center;gap:6px;font-size:14px;color:#59A398;font-weight:600;margin-bottom:13px;flex-shrink:0}
.detail-meta svg{width:15px;height:15px;stroke:#59A398;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.detail-desc{font-size:14px;color:#444;line-height:1.6;margin-bottom:13px;max-height:320px;overflow-y:auto;padding-right:4px;flex-shrink:0}
.detail-desc p{margin-bottom:10px}
.detail-note{font-size:14px;color:#59A398;font-weight:700;line-height:1.5;margin-bottom:11px;flex-shrink:0}
.detail-actions{display:flex;flex-wrap:wrap;gap:9px;flex-shrink:0}
.detail-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:#5D70AE;color:#fff;border-radius:7px;padding:.7rem 1.15rem;text-decoration:none;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:700;transition:background .15s;
  cursor:pointer;border:none;
}
.detail-btn:hover{background:#59A398}
.detail-btn.secondary{background:#ffffff;color:#5D70AE;border:1px solid #A6B3D5}
.detail-btn.secondary:hover{background:#F3F6FF;color:#5D70AE}

/* ===== Book 1:1 time, not tied to any date ===== */
.booking-card{
  margin-top:16px;border:1px solid #A6B3D5;border-radius:8px;
  background:linear-gradient(160deg,#ffffff 0%,#E8EDF8 100%);
  padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  transition:transform .18s ease, background .18s ease;
}
.booking-card:hover{background:linear-gradient(160deg,#ffffff 0%,#DAF3EF 100%)}
.booking-icon{
  width:30px;height:30px;flex-shrink:0;border-radius:7px;background:#ffffff;border:1px solid #A6B3D5;
  display:flex;align-items:center;justify-content:center;
}
.booking-icon svg{width:16px;height:16px}
.booking-text{flex:1;min-width:180px}
.booking-eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#59A398;margin-bottom:2px}
.booking-title{font-family:'Inter',sans-serif;font-weight:700;font-size:13px;color:#1B2F5B;margin-bottom:2px}
.booking-body{font-size:11.5px;color:#444;line-height:1.4}
.booking-btn{
  flex-shrink:0;background:#5D70AE;color:#fff;border-radius:6px;padding:.5rem .85rem;text-decoration:none;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:700;transition:background .15s;
}
.booking-btn:hover{background:#59A398}
</style>
</head>
<body>

<div class="cal-wrap">
  <div class="cal-card">
    <div class="cal-nav">
      <span class="cal-arrow" id="cal-prev-arrow" onclick="shiftMonth(-1)">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </span>
      <span class="cal-month" id="cal-month-label"></span>
      <span class="cal-arrow" onclick="shiftMonth(1)">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </span>
    </div>
    <div class="cal-grid" id="cal-dow"></div>
    <div class="cal-grid" id="cal-grid" style="margin-top:4px"></div>

    <p class="cal-hint" id="cal-hint">Select a highlighted date to view session details.</p>

    <div class="cal-legend" id="cal-legend"></div>

    <div class="booking-card">
      <div class="booking-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5D70AE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M8 14h2"/></svg>
      </div>
      <div class="booking-text">
        <p class="booking-eyebrow">Anytime</p>
        <p class="booking-title">Want 1:1 Time With Learning &amp; Development?</p>
        <p class="booking-body">Not every question needs to wait for the next live session. Grab a spot on my calendar whenever it's useful, any day works.</p>
      </div>
      <a class="booking-btn" href="https://bookings.cloud.microsoft/bookwithme/user/0eb0701c0ce2428db0d0472921a2a548%40propelrpay.com?anonymous&ismsaljsauthenabled=true" target="_blank" rel="noopener">Book a Time</a>
    </div>
  </div>

  <div class="detail-card" id="detail-card"></div>
</div>

<script>
var CAT_COLOR = {
  llo:      "#7B3FA0",
  fiserv:   "#8B5E3C"
};
var PAST_COLOR = "#B8860B";
var CAT_LABEL = {
  llo:      "Learning Lift-Off",
  fiserv:   "Fiserv Wholesale Training"
};

var fiservDesc = [
  "Fiserv Wholesale Training session. This session's recording is linked below."
];

var lloGenericInvite = [
  "Every member of the Prop plane is invested in your growth and is committed to creating ongoing learning opportunities that provide the tools and resources you need to win new business and deliver even more value to your existing clients.",
  "That is why we are excited to invite you to our monthly Learning Lift-Off webinar series, where we take a deep dive into a new topic designed to sharpen your expertise and expand your selling power.",
  "Topic to be announced soon. Have an idea for what we should cover? Send it our way."
];
var missedText = "We are sorry you missed this month's Learning Lift-Off. You can find the session recording here.";
var recordingsLink = "https://propelrpay1.sharepoint.com/sites/Training/SitePages/Leaning%20Lift-Off.aspx";
var topicMailto = "mailto:blush@propelrpay.com?subject=Learning%20Lift-Off%20Topic%20Idea";

var pendingNote = "Invites for this session go out two months before the onboarding date. Check back closer to then.";
var lloPendingNote = "Registration opens closer to the date. Check back soon.";

var ldBookingLink = "https://bookings.cloud.microsoft/bookwithme/user/0eb0701c0ce2428db0d0472921a2a548%40propelrpay.com?anonymous&ismsaljsauthenabled=true";

function addCalUrl(subject, dateISO, startTime, endTime, offset, joinLink){
  var start = dateISO + "T" + startTime + ":00" + offset;
  var end = dateISO + "T" + endTime + ":00" + offset;
  var body = "Join the session here: " + joinLink;
  return "https://outlook.office.com/calendar/0/deeplink/compose"
    + "?subject=" + encodeURIComponent(subject)
    + "&startdt=" + encodeURIComponent(start)
    + "&enddt=" + encodeURIComponent(end)
    + "&body=" + encodeURIComponent(body)
    + "&location=" + encodeURIComponent("Microsoft Teams")
    + "&allday=false";
}

// EDT (-04:00) through Oct 2026, EST (-05:00) once DST ends Nov 1, 2026
var EDT = "-04:00";
var EST = "-05:00";

var events = {};
function pushEvent(dateISO, ev){
  if (!events[dateISO]) events[dateISO] = [];
  events[dateISO].push(ev);
}

function addLLO(dateISO, status, link, offset){
  var ev = {
    kind: "llo", status: status, title: "Learning Lift-Off: Topic TBD",
    time: "3:00 PM EST", description: (status === "past") ? [missedText] : lloGenericInvite,
    mailto: topicMailto
  };
  if (status === "confirmed") {
    ev.join = link;
  } else if (status === "past") {
    ev.recordingLink = link || recordingsLink;
  }
  pushEvent(dateISO, ev);
}
function addFiserv(dateISO, recordingLink){
  pushEvent(dateISO, {
    kind: "fiserv", status: "past", title: "Fiserv Wholesale Training",
    time: "Recorded Session", recordingLink: recordingLink,
    description: fiservDesc
  });
}

// Learning Lift-Off (third Tuesday, July is the exception)
addLLO("2026-03-17", "past", "https://propelrpay1.sharepoint.com/:v:/s/AviatorLD/IQCh1fYlYxb0R6LE94X3cj0XAY0V2drDvpgTWAGdyBCM498?e=vl5ZrX");
events["2026-03-17"][0].title = "Learning Lift-Off: Valor PayTech Virtual Terminal";

addLLO("2026-04-21", "past", "https://propelrpay1.sharepoint.com/:v:/s/AviatorLD/IQBRKSe2kF7MRqJQO7rz843_AdHPItZvdZzrCnq_ajEuyfM?e=oZQGjh");
events["2026-04-21"][0].title = "Learning Lift-Off: Valor PayTech Hardware";

addLLO("2026-05-28", "past", "https://propelrpay1.sharepoint.com/:v:/s/AviatorLD/IQDSiwejoKRRQIkE_SdWmZfyASc66b5sjo85T22KUKC-aEw?e=HzibBE");
events["2026-05-28"][0].title = "Learning Lift-Off: ISV & Referral Partnerships";

addLLO("2026-06-16", "past", "https://propelrpay1.sharepoint.com/:v:/s/AviatorLD/IQAXa2rmuQOMS4917AU__Ll4AaZdyOju9_8GiVJFWqkpk4g?e=ipcIvv");
events["2026-06-16"][0].title = "Learning Lift-Off: Stratus Onboarding";

addLLO("2026-07-14", "past", "https://propelrpay1.sharepoint.com/:v:/s/AviatorLD/IQAiGhwfA2gnS4PMRitIlKeTAaQjbd1D0HPhD7CVv6WGwGc?e=t7LEEG");
events["2026-07-14"][0].title = "Learning Lift-Off: Equipment Financing";
addLLO("2026-08-18", "confirmed", "https://events.teams.microsoft.com/event/c88b6666-3c95-4062-bb37-b7ace6aa6498@db4bb98e-b39f-4bfd-b3e3-e0b809d1bb6a", EDT);
events["2026-08-18"][0].title = "Learning Lift-Off: Merchant Capital";
events["2026-08-18"][0].description = [
  "Join us for our next Learning Lift-Off as we explore Merchant Capital at Propelr and the funding options available to help our clients access flexible capital when they need it most.",
  "We'll cover how merchant capital can support business needs like purchasing equipment, making repairs, covering payroll, paying vendors, investing in marketing or opening a new location. You'll also learn how these solutions can help you create more merchant touchpoints, strengthen relationships, reduce attrition and earn additional commission.",
  "We look forward to having you attend the event!"
];
addLLO("2026-09-15", "confirmed", "https://events.teams.microsoft.com/event/8562852e-45a3-4451-b6be-ecc13dccd11e@db4bb98e-b39f-4bfd-b3e3-e0b809d1bb6a", EDT);
addLLO("2026-10-20", "confirmed", "https://events.teams.microsoft.com/event/0c821bcc-32e6-4617-96e5-1885f63e9074@db4bb98e-b39f-4bfd-b3e3-e0b809d1bb6a", EDT);
addLLO("2026-11-17", "pending");

// Fiserv Wholesale Training
addFiserv("2026-02-10", "https://propelrpay1.sharepoint.com/:v:/s/AviatorLD/IQA9o1f8DMK7SZYdrsJKBGICAePcnTPFzK3vtdk3t2xhXs8?e=x4OVkC");
addFiserv("2026-02-11", "https://propelrpay1.sharepoint.com/:v:/s/AviatorLD/IQDkbJCINpyXQrQ1Mt9RO9JUAbgBXQMs0Xn574hPXRnU6Ow?e=mBDWu1");
addFiserv("2026-02-12", "https://propelrpay1.sharepoint.com/:v:/s/AviatorLD/IQCPg-4r861sRZ1mOFJbcZc1AXkTLfMueAbVcdWD1qsVyAc?e=VpIUcg");

var _today = new Date();
var viewYear = _today.getFullYear();
var viewMonth = _today.getMonth();
if (viewMonth === 11) { viewMonth = 0; viewYear++; } // December isn't part of the calendar
var MIN_YEAR = 2026;
var MIN_MONTH = 0; // January 2026 is as far back as navigation goes; December is skipped entirely
var selectedKey = null;

var dowNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function pad(n){ return n < 10 ? "0" + n : "" + n; }
function keyFor(y,m,d){ return y + "-" + pad(m+1) + "-" + pad(d); }

function todayISO(){
  var t = new Date();
  return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate());
}

// Onboarding-group events (welcome/training/tools/field) age into "past" automatically
// once their date has gone by, no manual status updates needed month to month.
function effectiveStatus(ev, key){
  if (ev.status === "confirmed" && key < todayISO()) return "past";
  return ev.status;
}

function formatDate(key){
  var parts = key.split("-");
  var y = parseInt(parts[0], 10);
  var m = parseInt(parts[1], 10) - 1;
  var d = parseInt(parts[2], 10);
  return monthNames[m] + " " + d + ", " + y;
}

function renderDow(){
  var el = document.getElementById('cal-dow');
  var html = "";
  for (var i = 0; i < 7; i++) html += '<div class="cal-dow">' + dowNames[i] + '</div>';
  el.innerHTML = html;
}

function renderLegend(){
  var html = "";
  html += '<span class="legend-item"><span class="legend-dot" style="background:' + CAT_COLOR.llo + '"></span>Learning Lift-Off</span>';
  html += '<span class="legend-item"><span class="legend-dot" style="background:' + PAST_COLOR + '"></span>Past Session</span>';
  document.getElementById('cal-legend').innerHTML = html;
}

function renderCalendar(){
  document.getElementById('cal-month-label').textContent = monthNames[viewMonth] + " " + viewYear;
  var atMin = (viewYear === MIN_YEAR && viewMonth === MIN_MONTH);
  document.getElementById('cal-prev-arrow').classList.toggle('disabled', atMin);
  var firstDow = new Date(viewYear, viewMonth, 1).getDay();
  var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  var grid = document.getElementById('cal-grid');
  var html = "";

  for (var b = 0; b < firstDow; b++) html += '<div class="cal-day blank"></div>';

  for (var d = 1; d <= daysInMonth; d++) {
    var key = keyFor(viewYear, viewMonth, d);
    var dayEvents = events[key] || [];
    var hasEvent = dayEvents.length > 0;
    var cls = "cal-day" + (hasEvent ? " has-event" : "") + (key === selectedKey ? " selected" : "");
    var marker = "";
    if (hasEvent) {
      var ev = dayEvents[0];
      var status = effectiveStatus(ev, key);
      var color = (status === "past") ? PAST_COLOR : CAT_COLOR[ev.kind];
      var isHollow = (status === "pending");
      var style = isHollow
        ? "background:transparent;border:2px solid " + color
        : "background:" + color + ";border:2px solid " + color;
      marker = '<span class="dot-row"><span class="dot" style="' + style + '"></span></span>';
    }
    var click = hasEvent ? ' onclick="selectDate(\'' + key + '\')"' : "";
    html += '<div class="' + cls + '"' + click + '>' + d + marker + '</div>';
  }

  grid.innerHTML = html;
}

function selectDate(key){
  selectedKey = key;
  renderCalendar();
  renderDetail(key);
}

function renderDetail(key){
  var dayEvents = events[key] || [];
  var card = document.getElementById('detail-card');
  var hint = document.getElementById('cal-hint');
  if (dayEvents.length === 0) {
    card.innerHTML = "";
    hint.style.display = "block";
    return;
  }
  hint.style.display = "none";

  var blocks = [];
  for (var i = 0; i < dayEvents.length; i++) {
    blocks.push(renderEventBlock(dayEvents[i], key));
  }
  card.innerHTML = blocks.join('<div style="border-top:1px solid #d8dce8;margin:16px 0;"></div>');
}

function renderEventBlock(ev, key){
  var status = effectiveStatus(ev, key);

  var descHtml = "";
  for (var i = 0; i < ev.description.length; i++) {
    descHtml += "<p>" + ev.description[i] + "</p>";
  }

  var metaText = (status === "past") ? formatDate(key) : (ev.time + ' \u2022 ' + formatDate(key));
  var metaHtml = '<p class="detail-meta"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>' + metaText + '</p>';

  var noteHtml = "";
  var actionsHtml = '<div class="detail-actions">';

  if (status === "past" && ev.recordingLink) {
    actionsHtml += '<a class="detail-btn" href="' + ev.recordingLink + '" target="_blank" rel="noopener">View Recording</a>';
  } else if (status === "past") {
    noteHtml = '<p class="detail-note">This session has already taken place.</p>';
  } else if (status === "pending") {
    noteHtml = '<p class="detail-note">' + (ev.kind === "llo" ? lloPendingNote : pendingNote) + '</p>';
    if (ev.mailto) {
      actionsHtml += '<a class="detail-btn secondary" href="' + ev.mailto + '">Email a topic idea</a>';
    }
  } else if (ev.join || ev.addCal) {
    if (ev.kind === "llo") {
      actionsHtml += '<a class="detail-btn" href="' + ev.join + '" target="_blank" rel="noopener">Register Here</a>';
    } else if (ev.addCal) {
      actionsHtml += '<a class="detail-btn" href="' + ev.addCal + '" target="_blank" rel="noopener">Add to Calendar</a>';
    }
    if (ev.mailto) {
      actionsHtml += '<a class="detail-btn secondary" href="' + ev.mailto + '">Email a topic idea</a>';
    }
  }
  if (ev.bookingLink) {
    actionsHtml += '<a class="detail-btn" href="' + ev.bookingLink + '" target="_blank" rel="noopener">Schedule Time</a>';
  }
  actionsHtml += '</div>';

  return '<p class="detail-title">' + ev.title + '</p>' +
    metaHtml +
    '<div class="detail-desc">' + descHtml + '</div>' +
    noteHtml +
    actionsHtml;
}

function shiftMonth(dir){
  var newMonth = viewMonth + dir;
  var newYear = viewYear;
  if (newMonth < 0) { newMonth = 11; newYear--; }
  if (newMonth > 11) { newMonth = 0; newYear++; }
  // December is not part of the calendar; skip past it in either direction
  if (newMonth === 11) {
    newMonth += dir;
    if (newMonth < 0) { newMonth = 11; newYear--; }
    if (newMonth > 11) { newMonth = 0; newYear++; }
  }
  if (newYear < MIN_YEAR || (newYear === MIN_YEAR && newMonth < MIN_MONTH)) {
    return; // don't go earlier than January 2026
  }
  viewMonth = newMonth;
  viewYear = newYear;
  renderCalendar();
  renderDetail(selectedKey);
}

renderDow();
renderLegend();
renderCalendar();
</script>
</body>
</html>
